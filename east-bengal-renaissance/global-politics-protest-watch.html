<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>আন্তর্জাতিক বিষয়াবলি | পূর্ববঙ্গ নবজাগরণ</title>
<meta name="description" content="আন্তর্জাতিক বিষয়াবলির সাপ্তাহিক সংবাদসংক্ষেপ।">
<script>(function(){let t;try{t=localStorage.getItem('ebr-theme')}catch(e){}document.documentElement.dataset.theme=t==='dark'||t==='light'?t:'light'})();</script>
<style>
html{color-scheme:light;background:#fffdf8;color:#24221f}html[data-theme=dark]{color-scheme:dark;background:#151515;color:#f5f1e9}
body{max-width:76ch;margin:3rem auto;padding:0 1.2rem;font:1.08rem/1.8 system-ui,sans-serif}
h1,h2,h3{line-height:1.35}h2{margin-top:2rem}li{margin:.55rem 0}nav{border-block:1px solid gray;padding:.5rem 0}a{overflow-wrap:anywhere}
</style>
<link rel="stylesheet" href="/assets/reading-shade.css"><script defer src="/assets/reading-shade.js"></script></head>
<body>
<main>
<nav aria-label="পাতার নেভিগেশন"><a href="index.html">প্রচ্ছদ</a> · <button type="button" id="theme-toggle">আলো / Light</button></nav>
<h1>আন্তর্জাতিক বিষয়াবলি</h1>
<p>কূটনীতি, সংঘাত, আন্তর্জাতিক নির্বাচন ও বিশ্ব অর্থনীতির গুরুত্বপূর্ণ ঘটনার সাপ্তাহিক সংবাদসংক্ষেপ।</p>
<p lang="en">International Affairs · A weekly brief on major global developments.</p>
<section id="weekly-updates" aria-label="সাপ্তাহিক সংবাদসংক্ষেপ">
</section>
<p>সংবাদসূত্র · <a href="https://apnews.com/world-news" lang="en">Associated Press — World News</a></p>
</main>
<script>(()=>{const b=document.getElementById('theme-toggle');b.addEventListener('click',()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('ebr-theme',t)}catch(e){}})})();</script>
</body></html>
